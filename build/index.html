<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elegant Store</title>
    <link rel="stylesheet" href="./css/main.css" />

    <link rel="icon" type="image/x-icon" href="./img/favicons/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="./img/favicons/apple-touch-icon.png">
</head>

<body>
    <div class="tagline">
    <svg class="tagline__icon icon icon--ticket-percent">
        <use href="./img/svgsprite/sprite.symbol.svg#ticket-percent"></use>
    </svg>

    <div class="tagline__desc">30% off storewide&#160;&#8212; Limited time!</div>

    <a href="#!" class="tagline__link">
        Shop Now
        <svg class="icon icon--arrow-right">
            <use href="./img/svgsprite/sprite.symbol.svg#arrow-right"></use>
        </svg>
    </a>

    <button class="tagline__close">
        <svg class="icon icon--close">
            <use href="./img/svgsprite/sprite.symbol.svg#close"></use>
        </svg>
    </button>
</div>
    <nav class="nav">
    <div class="container">
        <div class="nav__row">
            <a href="#!" class="nav__logo logo">3legant.</a>
            <ul class="nav__list">
                <li class="nav__item">
                    <a href="#!" class="nav__link">Home</a>
                </li>
                <li class="nav__item">
                    <button href="#!" class="nav__link">Shop <svg class="icon icon--chevron-down">
                            <use href="./img/svgsprite/sprite.symbol.svg#chevron-down"></use>
                        </svg>
                    </button>
                </li>
                <li class="nav__item">
                    <button href="#!" class="nav__link">Product <svg class="icon icon--chevron-down">
                            <use href="./img/svgsprite/sprite.symbol.svg#chevron-down"></use>
                        </svg>
                    </button>
                </li>
                <li class="nav__item">
                    <a href="#!" class="nav__link">Contact Us</a>
                </li>
            </ul>
            <div class="nav__btns">
                <button class="nav__btn">
                    <svg class="icon icon--nav-search">
                        <use href="./img/svgsprite/sprite.symbol.svg#nav-search"></use>
                    </svg>
                </button>
                <button class="nav__btn">
                    <svg class="icon icon--user-circle">
                        <use href="./img/svgsprite/sprite.symbol.svg#user-circle"></use>
                    </svg>
                </button>
                <button class="nav__btn">
                    <svg class="icon icon--shopping-bag">
                        <use href="./img/svgsprite/sprite.symbol.svg#shopping-bag"></use>
                    </svg>
                    <span class="nav__btn-count">2</span>
                </button>
            </div>
        </div>
    </div>
</nav>
    <section class="hero">
    <div class="container-half-right">
        <div class="hero__content">
            <div class="hero__title">
                Listen to<br>the <span>amazing</span> music sound.
            </div>
            <div class="hero__desc">
                <p>Experience music like never before</p>
            </div>
            <div class="hero__link">
                <a href="#!" class="btn btn--m">Shopping Now</a>
            </div>
        </div>
    </div>
</section>
    <header class="header">
    <div class="container">
        <div class="header__row">
            <div class="logo">Header</div>
            <nav class="header__nav nav">
                <ul class="nav__list">
                    <li><a href="" class="active"></a></li>
                    <li><a href=""></a></li>
                </ul>
            </nav>
            <button class="mobile-nav-btn">
                <div class="nav-icon"></div>
            </button>
        </div>
    </div>
</header>
<div class="mobile-nav">
    <ul class="mobile-nav__list">
        <li><a href="index.html">Главная</a></li>
        <li><a href="docs.html">Документация</a></li>
    </ul>
</div>

    <main class="docs">
    </main>
    <footer class="footer">
    <div class="container">
        <div class="footer__copyright">
            Footer
        </div>
    </div>
</footer>
    <script src="./js/index.bundle.js"></script>
</body>

</html>
