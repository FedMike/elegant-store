<div class="swiper-slide">
    <article class="card">
        <div class="card__picture">
            <img src="./../../img/arrivals/@@img.jpg" srcset="./../../img/arrivals/@@img@2x.jpg" alt="headphones">
            <div class="card__new">@@status</div>
            <div class="card__fav">
                <button class="btn--fav">
                    <svg class="icon icon--fav">
                        <use href="./img/svgsprite/sprite.symbol.svg#fav"></use>
                    </svg>
                </button>
            </div>
            <div class="card__btn">
                <button class="btn btn--s btn--wide">Add to cart</button>
            </div>
        </div>
        <div class="card__desc">

            <div class="card__rating">
                @@for (var i = 0; i < context.rating; i++) { <svg class="icon icon--star">
                    <use href="./img/svgsprite/sprite.symbol.svg#star"></use>
                    </svg>
                    }
            </div>

            <div class="card__title">@@title</div>
            <div class="card__price">@@price</div>
        </div>
        <a href="#!" class="card__link"></a>
    </article>
</div>
